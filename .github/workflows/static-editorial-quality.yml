name: Static editorial quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check editorial-interruptions.js
          node --check ai-transparency.js
          node --check global-language.js
          node --check on-device-translation.js
          node --check participation-pulse.js
          node --check storage-transparency.js

      - name: Validate editorial architecture and routing
        run: node scripts/validate-static-site.mjs

      - name: Validate Vercel configuration JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json valid')"